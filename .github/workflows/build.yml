name: Build UAPKI Full
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: vcpkg install curl:x86-windows openssl:x86-windows

      - name: Configure CMake
        run: |
          # Створюємо папки точно там, де їх шукає проект згідно з твоїм DEBUG логом
          mkdir build/out -Force
          mkdir out/win32 -Force
          
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DBUILD_SHARED_LIBS=ON
          
      - name: Build All
        # Тепер, коли папки існують, ALL_BUILD не має падати на копіюванні
        run: cmake --build build --config Release

      - name: Collect and Diagnose
        if: always()
        shell: pwsh
        run: |
          mkdir final_pack -ErrorAction SilentlyContinue
          
          # Шукаємо DLL та EXE всюди, ігноруючи папку призначення
          Write-Host "Пошук результатів збірки..."
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          
          # Додаємо залежності vcpkg
          Copy-Item "C:/vcpkg/installed/x86-windows/bin/*.dll" -Destination final_pack -Force -ErrorAction SilentlyContinue
          
          Write-Host "--- ПЕРЕЛІК ОТРИМАНИХ ФАЙЛІВ ---"
          Get-ChildItem final_pack | Select-Object Name, @{Name="Size(KB)";Expression={[math]::round($_.Length / 1KB, 2)}} | Format-Table -AutoSize

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UAPKI_Full_Bundle
          path: final_pack/
