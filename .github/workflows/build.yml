name: Build UAPKI Full
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: vcpkg install curl:x86-windows openssl:x86-windows

      - name: Configure CMake
        run: |
          # Створюємо структуру папок, яку очікує проект для копіювання
          mkdir library/out/win32 -Force
          mkdir out/win32 -Force
          
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DBUILD_SHARED_LIBS=ON `
          -DADD_TESTS=OFF
          
      - name: Build
        # Ми прибираємо continue-on-error, бо тепер він має пройти чисто
        run: cmake --build build --config Release
        
      - name: Find and Collect Everything
        if: always()
        shell: pwsh
        run: |
          mkdir final_pack -ErrorAction SilentlyContinue
          
          # 1. Збираємо всі DLL та EXE, ігноруючи папку призначення та помилки доступу
          Write-Host "Починаю глобальний пошук файлів..."
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          
          # 2. Додаємо системні залежності vcpkg (CURL, OpenSSL)
          Copy-Item "C:/vcpkg/installed/x86-windows/bin/*.dll" -Destination final_pack -Force -ErrorAction SilentlyContinue
          
          # 3. Виводимо список знайденого для діагностики
          Write-Host "--- ФІНАЛЬНИЙ СПИСОК ЗНАЙДЕНИХ ФАЙЛІВ ---"
          Get-ChildItem final_pack | Select-Object Name, @{Name="Size(KB)";Expression={$_.Length / 1KB}} | Format-Table -AutoSize

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UAPKI_Build_Package
          path: final_pack/
