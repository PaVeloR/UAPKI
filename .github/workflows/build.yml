name: Build UAPKI DLL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (CURL)
        # Використовуємо vcpkg для швидкого встановлення CURL під потрібну архітектуру
        run: vcpkg install curl:x86-windows

      - name: Configure CMake
        # Додаємо параметр CMAKE_TOOLCHAIN_FILE, щоб CMake побачив встановлений CURL
        run: |
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: uapki-dll-win32
          path: build/uapki/Release/uapki.dll
