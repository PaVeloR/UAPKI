name: Build UAPKI DLL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: vcpkg install curl:x86-windows openssl:x86-windows

      - name: Configure CMake
        run: |
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        # Ми додаємо "continue-on-error", бо знаємо, що помилка лише в копіюванні
        continue-on-error: true
        run: cmake --build build --config Release

      - name: Prepare Deployment Folder
        shell: pwsh
        run: |
          mkdir deploy_final
          # Шукаємо ВСІ dll, які наплодив компілятор, і згрібаємо в одну папку
          Get-ChildItem -Path build -Filter "*.dll" -Recurse | Copy-Item -Destination deploy_final
          Get-ChildItem -Path build -Filter "*.exe" -Recurse | Copy-Item -Destination deploy_final
          # Додаємо залежності vcpkg
          Copy-Item "C:/vcpkg/installed/x86-windows/bin/*.dll" -Destination deploy_final -ErrorAction SilentlyContinue
          # Перевіряємо, що ми знайшли (це з'явиться в логах)
          ls deploy_final
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: UAPKI_Final_Package
          path: final_bin/
