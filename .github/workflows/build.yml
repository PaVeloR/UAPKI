name: Build UAPKI DLL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Це важливо, щоб стягнути всі частини коду

      - name: Configure CMake
        # Ми кажемо: візьми код з папки library (-S library) 
        # і збери його в папку build (-B build)
        run: cmake -S library -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: uapki-dll-win32
          # Оскільки ми збирали прямо з папки library, 
          # DLL з'явиться за цим шляхом:
          path: build/uapki/Release/uapki.dll
