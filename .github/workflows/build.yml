name: Build UAPKI DLL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: vcpkg install curl:x86-windows openssl:x86-windows

      - name: Configure CMake
        run: |
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        # Ми додаємо "continue-on-error", бо знаємо, що помилка лише в копіюванні
        continue-on-error: true
        run: cmake --build build --config Release

      - name: Prepare Deployment Folder
        shell: pwsh
        run: |
          mkdir final_bin
          # Збираємо основну DLL та допоміжні частини
          # Вони розкидані по папках build, тому шукаємо їх ретельно:
          Get-ChildItem -Path build -Filter "*.dll" -Recurse | Copy-Item -Destination final_bin
          Get-ChildItem -Path build -Filter "*.exe" -Recurse | Copy-Item -Destination final_bin
          # Додаємо залежності від CURL та OpenSSL
          Copy-Item "C:/vcpkg/installed/x86-windows/bin/*.dll" -Destination final_bin -ErrorAction SilentlyContinue

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: UAPKI_Final_Package
          path: final_bin/
