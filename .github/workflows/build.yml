name: Build UAPKI DLL
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # Це важливо, щоб стягнути всі частини коду

      - name: Configure CMake
        # Якщо твій додаток на Delphi 32-бітний, залиш Win32. Якщо 64-біт — пиши x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A Win32 

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: uapki-windows-dll
          path: build/library/Release/uapki.dll
