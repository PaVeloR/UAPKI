name: Build UAPKI Full
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        # Встановлюємо curl та openssl саме для x86-windows
        run: vcpkg install curl:x86-windows openssl:x86-windows --triplet x86-windows

      - name: Check Dependencies Presence
        shell: pwsh
        run: |
          $curl_header = "C:/vcpkg/installed/x86-windows/include/curl/curl.h"
          Write-Host "--- ПЕРЕВІРКА ЗАЛЕЖНОСТЕЙ ---"
          if (Test-Path $curl_header) {
            Write-Host "[OK] Знайдено: $curl_header"
            $size = (Get-Item $curl_header).Length
            Write-Host "Розмір файлу: $size байт"
          } else {
            Write-Host "[ERROR] ФАЙЛ НЕ ЗНАЙДЕНО ЗА ШЛЯХОМ: $curl_header"
            Write-Host "Вміст папки vcpkg/installed/x86-windows/include:"
            Get-ChildItem -Path "C:/vcpkg/installed/x86-windows/include" -ErrorAction SilentlyContinue
            exit 1 # Зупинити білд, якщо залежностей немає
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          mkdir build/out -Force
          mkdir out/win32 -Force
          
          cmake -S library -B build `
          -G "Visual Studio 17 2022" -A Win32 `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x86-windows `
          -DBUILD_SHARED_LIBS=ON `
          -DCMAKE_C_FLAGS="/I C:/vcpkg/installed/x86-windows/include /D CURL_STATICLIB" `
          -DCMAKE_CXX_FLAGS="/I C:/vcpkg/installed/x86-windows/include /D CURL_STATICLIB" `
          -DCMAKE_EXE_LINKER_FLAGS="ws2_32.lib crypt32.lib advapi32.lib" `
          -DCMAKE_SHARED_LINKER_FLAGS="ws2_32.lib crypt32.lib advapi32.lib"
          
      - name: Build
        run: cmake --build build --config Release
        
      - name: Find and Collect Everything
        if: always()
        shell: pwsh
        run: |
          mkdir final_pack -ErrorAction SilentlyContinue
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.dll" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          Get-ChildItem -Path D:\a\UAPKI\UAPKI -Filter "*.exe" -Recurse | Where-Object { $_.FullName -notmatch "final_pack" } | Copy-Item -Destination final_pack -Force -ErrorAction SilentlyContinue
          Copy-Item "C:/vcpkg/installed/x86-windows/bin/*.dll" -Destination final_pack -Force -ErrorAction SilentlyContinue
          ls final_pack

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UAPKI_Full_Package
          path: final_pack/
